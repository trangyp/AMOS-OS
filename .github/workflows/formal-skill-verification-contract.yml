name: Formal Skill Verification Contract
on:
  pull_request:
    paths:
      - '07_SKILLS/amos-formal-agent-skill-verification-rscf/**'
      - '06_AGENTS/amos-formal-agent-skill-verification-rscf-agent.json'
      - '08_WORKFLOWS/amos-formal-agent-skill-verification-rscf-workflow.md'
      - '26_WORKFLOWS/amos-formal-agent-skill-verification-rscf-workflow.md'
      - '14_TOOLS/SKILL_CAPABILITY_CONTAINMENT_VERIFIER.md'
      - '19_TESTS/test_formal_skill_verification.py'
      - '.github/agents/amos-skill-capability-verifier.agent.md'
      - '.github/workflows/formal-skill-verification-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-skill-verification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile deterministic surfaces
        run: |
          python -m py_compile \
            07_SKILLS/amos-formal-agent-skill-verification-rscf/scripts/verify_skill.py \
            07_SKILLS/amos-formal-agent-skill-verification-rscf/scripts/audit_rscf.py \
            19_TESTS/test_formal_skill_verification.py
      - name: Run capability containment tests
        run: python -m unittest -q 19_TESTS/test_formal_skill_verification.py
      - name: Run receipt validator self-test
        run: python 07_SKILLS/amos-formal-agent-skill-verification-rscf/scripts/audit_rscf.py --self-test
      - name: Enforce proof and authority firewalls
        run: |
          grep -q 'STATIC_CONTAINMENT != FORMAL_PROGRAM_PROOF' 07_SKILLS/amos-formal-agent-skill-verification-rscf/SKILL.md
          grep -q 'CAPABILITY != AUTHORITY' 07_SKILLS/amos-formal-agent-skill-verification-rscf/SKILL.md
          grep -q '"execution_authority": "none"' 06_AGENTS/amos-formal-agent-skill-verification-rscf-agent.json
          ! grep -q 'log_inputs.*true' 06_AGENTS/amos-formal-agent-skill-verification-rscf-agent.json
