name: Formal Skill Scanner Diagnostic
on:
  pull_request:
    paths:
      - '07_SKILLS/amos-formal-agent-skill-verification-rscf/**'
      - '.github/workflows/_formal-skill-scanner-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned scanner release
        run: python -m pip install 'cisco-ai-skill-scanner==2.1.0'
      - name: Print detailed findings for new Skill only
        shell: bash
        run: |
          set +e
          skill-scanner scan 07_SKILLS/amos-formal-agent-skill-verification-rscf \
            --format table --policy strict --use-behavioral --detailed \
            --fail-on-severity high
          rc=$?
          echo "diagnostic scanner exit code: $rc"
          exit 0
