name: AMOS Agent Skill Runtime Audit

# Executable audit for the repository-native agent/skill/workflow surface.
# Keep this workflow deliberately small: every claimed gate below maps to a
# repository-present deterministic validator.

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/agents/**'
      - '.github/workflows/**'
      - '06_AGENT_SYSTEMS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '11_KNOWLEDGE/EXTERNAL_AGENT_SOURCE_REGISTRY.json'
      - '14_TOOLS/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/agents/**'
      - '.github/workflows/**'
      - '06_AGENT_SYSTEMS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '11_KNOWLEDGE/EXTERNAL_AGENT_SOURCE_REGISTRY.json'
      - '14_TOOLS/**'
      - 'scripts/**'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: amos-agent-skill-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate governed agent/skill runtime surface
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic validators
        run: python3 -m compileall -q scripts

      - name: Validate pinned external source registry
        run: python3 scripts/validate_external_agent_sources.py

      - name: Validate AMOS skills and GitHub custom agents
        run: python3 scripts/validate_agent_skill_surface.py --summary

      - name: Validate workflow local-reference integrity
        run: python3 scripts/validate_workflow_references.py

      - name: Validate changed-file whitespace integrity
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" || git diff --check HEAD^

      - name: Record scoped validation summary
        if: always()
        run: |
          {
            echo '## AMOS Agent/Skill Runtime Audit'
            echo ''
            echo 'This workflow validates repository structure and deterministic contracts only.'
            echo 'A green run is not canon promotion, external-source trust, merge authority, or production validity.'
            echo ''
            echo "Head: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
