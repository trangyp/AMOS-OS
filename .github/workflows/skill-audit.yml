name: AMOS Repository Contract

on:
  pull_request:
    paths:
      - '06_AGENTS/**'
      - '06_AGENT_SYSTEMS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '04_RUNTIME/**'
      - 'scripts/**'
      - '.github/**'
  push:
    branches: [main, develop]
    paths:
      - '06_AGENTS/**'
      - '06_AGENT_SYSTEMS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '04_RUNTIME/**'
      - 'scripts/**'
      - '.github/**'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: amos-repository-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test validators
        run: |
          python3 scripts/amos_repo_validator.py --self-test
          python3 scripts/agent_protocol_abi.py --self-test
          python3 scripts/validate_agent_task_lifecycle.py --self-test
      - name: Validate changed AMOS contracts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 scripts/amos_repo_validator.py --base-ref "$BASE_REF"
          else
            python3 scripts/amos_repo_validator.py
          fi
      - name: Audit agent interoperability ABI
        run: python3 scripts/agent_protocol_abi.py --scan-dir 06_AGENTS
      - name: Summary
        if: always()
        run: |
          echo "## AMOS Repository Contract" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validator self-tests execute before repository checks." >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed skills and agents are hard-gated; legacy corpus debt is reported separately." >> "$GITHUB_STEP_SUMMARY"
          echo "- Task lifecycle legality, leases/fencing, artifact completion, and child attenuation have executable self-tests." >> "$GITHUB_STEP_SUMMARY"
          echo "- Legacy A2A declarations are not promoted to deployed endpoints." >> "$GITHUB_STEP_SUMMARY"
          echo "- External skill threat scanning remains a separate defense-in-depth workflow." >> "$GITHUB_STEP_SUMMARY"
