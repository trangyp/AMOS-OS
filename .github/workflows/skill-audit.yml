name: Skill Audit

# Executable AMOS repository contract gate.
# External skill/MCP security scanning is intentionally separate in
# external-skill-security.yml so structural validation is not conflated with
# third-party threat detection.

on:
  pull_request:
    paths:
      - '06_AGENTS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '.github/**'
      - 'scripts/amos_repo_audit.py'
      - 'scripts/validate_workflow_supply_chain.py'
  push:
    branches: [main]
    paths:
      - '06_AGENTS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '.github/**'
      - 'scripts/amos_repo_audit.py'
      - 'scripts/validate_workflow_supply_chain.py'

concurrency:
  group: skill-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve comparison base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: Fetch exact comparison base only
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile audit executables
        run: |
          python -m py_compile \
            scripts/amos_repo_audit.py \
            scripts/validate_workflow_supply_chain.py

      - name: Run audit self-tests
        run: |
          python scripts/amos_repo_audit.py --self-test
          python scripts/validate_workflow_supply_chain.py --self-test

      - name: Audit changed contracts and workflow references
        run: python scripts/amos_repo_audit.py --repo . --base "$BASE_SHA"

      - name: Enforce immutable action dependencies
        run: python scripts/validate_workflow_supply_chain.py --repo .

      - name: Record bounded evidence
        if: always()
        run: |
          echo '## AMOS Skill Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Structural checks: executable repository contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: changed Skills/agents + global workflow Python-reference integrity' >> "$GITHUB_STEP_SUMMARY"
          echo '- Fetch scope: exact head + exact comparison base; no full-history checkout' >> "$GITHUB_STEP_SUMMARY"
          echo '- External GitHub Actions: immutable 40-char commit-SHA pins required' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security: evaluated separately by External Skill Security' >> "$GITHUB_STEP_SUMMARY"
          echo '- A PASS is evidence for these checks only; it is not proof of semantic correctness or safety.' >> "$GITHUB_STEP_SUMMARY"
