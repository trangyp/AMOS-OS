name: Skill Audit

# Executable AMOS repository contract gate.
# External skill/MCP security scanning is intentionally separate in
# external-skill-security.yml so structural validation is not conflated with
# third-party threat detection.

on:
  pull_request:
    paths:
      - '06_AGENTS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '.github/**'
      - 'scripts/amos_repo_audit.py'
  push:
    branches: [main]
    paths:
      - '06_AGENTS/**'
      - '07_SKILLS/**'
      - '08_WORKFLOWS/**'
      - '14_TOOLS/**'
      - '26_WORKFLOWS/**'
      - '.github/**'
      - 'scripts/amos_repo_audit.py'

concurrency:
  group: skill-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile audit executable
        run: python -m py_compile scripts/amos_repo_audit.py

      - name: Run audit self-test
        run: python scripts/amos_repo_audit.py --self-test

      - name: Audit pull-request change set
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/amos_repo_audit.py --repo . --base "$BASE_SHA"

      - name: Audit pushed change set
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/amos_repo_audit.py --repo . --base "$BASE_SHA"

      - name: Record bounded evidence
        if: always()
        run: |
          echo '## AMOS Skill Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Structural checks: executable repository contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: changed Skills/agents + global workflow Python-reference integrity' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security: evaluated separately by External Skill Security' >> "$GITHUB_STEP_SUMMARY"
          echo '- A PASS is evidence for these checks only; it is not proof of semantic correctness or safety.' >> "$GITHUB_STEP_SUMMARY"
