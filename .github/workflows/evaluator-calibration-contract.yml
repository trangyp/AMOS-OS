name: Evaluator Calibration Contract
on:
  pull_request:
    paths:
      - '07_SKILLS/amos-evaluator-calibration-rscf/**'
      - '06_AGENTS/amos-evaluator-calibration-rscf-agent.json'
      - '08_WORKFLOWS/amos-evaluator-calibration-rscf-workflow.md'
      - '26_WORKFLOWS/amos-evaluator-calibration-rscf-workflow.md'
      - '14_TOOLS/EVALUATOR_CALIBRATION_VERIFIER.md'
      - '14_TOOLS/TOOL_REGISTRY_MASTER.md'
      - '19_TESTS/test_evaluator_calibration_runtime.py'
      - '.github/agents/amos-evaluator-calibration-auditor.agent.md'
      - '.github/workflows/evaluator-calibration-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluator-calibration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile deterministic surfaces
        run: |
          python -m py_compile \
            07_SKILLS/amos-evaluator-calibration-rscf/scripts/evaluator_calibration.py \
            07_SKILLS/amos-evaluator-calibration-rscf/scripts/calibration_contract_check.py \
            19_TESTS/test_evaluator_calibration_runtime.py
      - name: Run calibration regression suite
        run: python -m unittest -q 19_TESTS/test_evaluator_calibration_runtime.py
      - name: Run runtime self-tests
        run: |
          python 07_SKILLS/amos-evaluator-calibration-rscf/scripts/evaluator_calibration.py --self-test
          python 07_SKILLS/amos-evaluator-calibration-rscf/scripts/calibration_contract_check.py --self-test
      - name: Enforce authority and calibration firewalls
        run: |
          grep -q 'CALIBRATED != CORRECT' 07_SKILLS/amos-evaluator-calibration-rscf/SKILL.md
          grep -q 'CALIBRATION_COHORT != VALIDATION_COHORT' 07_SKILLS/amos-evaluator-calibration-rscf/SKILL.md
          grep -q 'RELIABILITY_GATE_PASS != DEPLOYMENT_VALIDITY' 07_SKILLS/amos-evaluator-calibration-rscf/SKILL.md
          grep -q '"deployment_authority": "none"' 06_AGENTS/amos-evaluator-calibration-rscf-agent.json
          ! grep -q 'log_inputs.*true' 06_AGENTS/amos-evaluator-calibration-rscf-agent.json
