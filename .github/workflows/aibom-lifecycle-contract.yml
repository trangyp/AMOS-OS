name: AIBOM Lifecycle Contract

on:
  pull_request:
    paths:
      - '07_SKILLS/amos-aibom-lifecycle-assurance-rscf/**'
      - '06_AGENTS/amos-aibom-lifecycle-assurance-rscf-agent.json'
      - '08_WORKFLOWS/amos-aibom-lifecycle-assurance-rscf-workflow.md'
      - '26_WORKFLOWS/amos-aibom-lifecycle-assurance-rscf-workflow.md'
      - '14_TOOLS/AIBOM_PROVENANCE_VERIFIER.md'
      - '14_TOOLS/TOOL_REGISTRY_MASTER.md'
      - '19_TESTS/test_aibom_lifecycle_runtime.py'
      - '11_KNOWLEDGE/AIBOM_SUPPLY_CHAIN_PROVENANCE_SOURCES.md'
      - '.github/agents/amos-aibom-auditor.agent.md'
      - '.github/workflows/aibom-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - '07_SKILLS/amos-aibom-lifecycle-assurance-rscf/**'
      - '06_AGENTS/amos-aibom-lifecycle-assurance-rscf-agent.json'
      - '08_WORKFLOWS/amos-aibom-lifecycle-assurance-rscf-workflow.md'
      - '26_WORKFLOWS/amos-aibom-lifecycle-assurance-rscf-workflow.md'
      - '14_TOOLS/AIBOM_PROVENANCE_VERIFIER.md'
      - '14_TOOLS/TOOL_REGISTRY_MASTER.md'
      - '19_TESTS/test_aibom_lifecycle_runtime.py'
      - '11_KNOWLEDGE/AIBOM_SUPPLY_CHAIN_PROVENANCE_SOURCES.md'
      - '.github/agents/amos-aibom-auditor.agent.md'
      - '.github/workflows/aibom-lifecycle-contract.yml'

permissions:
  contents: read

jobs:
  aibom-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile AIBOM runtime and validators
        run: |
          python -m py_compile \
            07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/aibom.py \
            07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/audit_rscf.py \
            19_TESTS/test_aibom_lifecycle_runtime.py

      - name: Execute AIBOM regression suite
        run: python -m unittest -v 19_TESTS/test_aibom_lifecycle_runtime.py

      - name: Execute runtime and receipt self-tests
        run: |
          python 07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/aibom.py --self-test
          python 07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/audit_rscf.py --self-test

      - name: Reject AIBOM authority promotion
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/audit_rscf.py')
          spec=importlib.util.spec_from_file_location('audit',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          r={'manifest_id':'m','schema_valid':True,'root_present':True,'hashes_valid':True,'lineage_closed':True,
             'attestation_subject_bound':True,'signature_claims_supported':True,'vulnerability_attribution_valid':True,
             'manifest_hash_valid':True,'structural_integrity':True,'policy_complete':True,
             'policy_checks':{'attestation':True,'verified_signature':True,'vulnerability_evidence':True,'environment_identity':True,'output_binding':True,'replay_evidence':True},
             'component_count':1,'attestation_count':1,'vulnerability_count':1,'output_binding_count':1,'sealed':True,
             'manifest_hash':'a'*64,'expected_manifest_hash':'a'*64,'authority_semantics':'AUTHORIZED',
             'trust_semantics':'DIGEST_OR_SIGNATURE_EVIDENCE_DOES_NOT_PROVE_SEMANTIC_CORRECTNESS',
             'completeness_semantics':'BOM_PRESENT_DOES_NOT_PROVE_COMPLETE_INVENTORY','receipt_hash':'b'*64}
          assert m.validate(r), 'authority promotion must fail closed'
          PY

      - name: Reject raw secret persistence
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('07_SKILLS/amos-aibom-lifecycle-assurance-rscf/scripts/audit_rscf.py')
          spec=importlib.util.spec_from_file_location('audit',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.validate({'binding_id':'b','manifest_id':'m','execution_id':'e','artifact_hash':'a'*64,'aibom_hash':'b'*64,'evidence_ref':'x','api_key':'secret'}), 'secret persistence must fail'
          PY

      - name: Record bounded evidence
        if: always()
        run: |
          echo '## AIBOM Lifecycle Contract' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Local AIBOM lifecycle runtime: EXECUTED_TESTED_SCOPE' >> "$GITHUB_STEP_SUMMARY"
          echo '- CycloneDX/SPDX normalization fixtures: EXECUTED_TESTED_SCOPE' >> "$GITHUB_STEP_SUMMARY"
          echo '- in-toto subject-digest binding: EXECUTED_TESTED_SCOPE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Local structural/policy/hash/drift/output-binding gates: EXECUTED_TESTED_SCOPE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cryptographic signature verification: EXTERNAL_EVIDENCE_ONLY / not executed here' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live vulnerability database query: UNKNOWN/GAP' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production inventory completeness and reproducibility: UNKNOWN/GAP' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deployment/merge/canonical authority: NONE' >> "$GITHUB_STEP_SUMMARY"
