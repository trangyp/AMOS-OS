# Hooks Configuration for amos-agentops-observability-rscf
# These hooks validate local Skill/trace contracts only. They do not grant tool,
# telemetry-capture, export, effect, or deployment authority.

hooks:
  PreToolUse:
    command: "python3 scripts/hooks/pre_tool_use.py"
    description: "Validate portable Skill structure before execution"
    block_on_failure: true

  PostToolUse:
    command: "python3 scripts/hooks/post_tool_use.py"
    description: "Validate structured trace artifacts when the output is compatible trace JSON"
    block_on_failure: true

  Stop:
    command: "python3 scripts/hooks/stop.py"
    description: "Run deterministic trace-contract self-test before completion"
    block_on_failure: true
